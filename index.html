<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Succinix — browser-native Linux</title>
  <style>
    /* ─── 基础：全屏黑底；终端常驻可见，boot 日志直接写入终端（无 splash 覆盖层）─── */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }
    #terminal {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #0a0a0a;
    }

    /* ─── 环境不适配错误页（DOM）：boot-ui.ts 的 fail() 填充并显示，常态隐藏 ─── */
    #boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      padding: 32px;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    /* 环境失败：显示错误页（boot 日志全程走终端，无 boot splash 覆盖层） */
    #boot-overlay.boot-error-mode {
      display: flex;
    }

    .boot-inner {
      max-width: min(92vw, 860px);
      width: 100%;
      line-height: 1.6;
    }

    .boot-error-head {
      margin-top: 28px;
      color: #d6cfc4;
      font-size: 16px;
      text-align: center;
    }
    .boot-error-list {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.8;
    }
    .boot-error-list .mark { color: #c0543a; font-weight: 700; }
    .boot-error-list .rest { color: #d6cfc4; }
    .boot-error-foot {
      margin-top: 24px;
      color: #6b6560;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    /* 窄屏（<640px）：错误页留白收紧 */
    @media (max-width: 639px) {
      #boot-overlay { padding: 20px; }
    }
  </style>
</head>
<body>
  <!-- 环境不适配错误页：boot-ui.ts 的 fail() 填充并显示（boot 日志全程在终端，无 splash 覆盖层） -->
  <div id="boot-overlay" role="alert">
    <div class="boot-inner">
      <div id="boot-error">
        <div id="boot-error-head" class="boot-error-head">Environment check failed</div>
        <div id="boot-error-list" class="boot-error-list"></div>
        <div id="boot-error-foot" class="boot-error-foot">
          Succinix requires a Chromium-based browser with cross-origin isolation.<br />
          See README for deployment requirements.
        </div>
      </div>
    </div>
  </div>
  <div id="terminal"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
