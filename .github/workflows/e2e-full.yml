name: e2e-full

# Full e2e, benchmark, and soak suite. Automatic triggers are paused; run manually when needed.
on:
  workflow_dispatch:

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare browser diagnostics directory
        run: mkdir -p artifacts/browser-diagnostics

      - name: Run full e2e suite (deploy gate retried once on flake)
        run: |
          set -o pipefail
          export SUCCINIX_DIAGNOSTICS_DIR="$PWD/artifacts/browser-diagnostics"
          node scripts/run-e2e.mjs 2>&1 | tee e2e-full.log

      - name: Run benchmark gate (median + 20% variance)
        run: |
          export SUCCINIX_DIAGNOSTICS_DIR="$PWD/artifacts/browser-diagnostics"
          npm run test:bench -- --skip-build

      - name: Run soak gates (10k / 100k / 100-release)
        run: |
          export SUCCINIX_DIAGNOSTICS_DIR="$PWD/artifacts/browser-diagnostics"
          npm run test:bench:soak

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence
          path: |
            docs/benchmark-baseline-v0.7.0.json
            public/sha256.json
            packages/engine/assets/sha256.json
            artifacts/browser-diagnostics/**
          if-no-files-found: ignore

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-full-log
          path: e2e-full.log
          if-no-files-found: ignore
