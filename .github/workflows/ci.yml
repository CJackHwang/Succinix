name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每晚跑重场景套件（nightly-scenarios job 仅 schedule 触发）
    - cron: '17 4 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 error)
        run: npm run lint

      - name: Typecheck (tsc --noEmit, 0 errors)
        run: npm run typecheck

      - name: Unit tests (vitest + coverage >= 70% core)
        run: npm run test:coverage

      - name: Build (build:host + vite build)
        run: npm run build

      - name: e2e deploy gate (vite preview + headless Chrome ?test=1 self-test >= 57)
        run: node scripts/verify-deploy.mjs --skip-build

  # 场景套件重（10 场景，含数据库/服务自启/持久化压力），nightly 跑，不进 push 门禁。
  nightly-scenarios:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scenario suite (build + preview + CDP)
        run: node scripts/scenarios.mjs
